        function usePersistentState(key, initialValue) {
            const [state, setState] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch (error) {
                    console.warn(`Error reading localStorage key "${key}":`, error);
                    return initialValue;
                }
            });

            useEffect(() => {
                try {
                    window.localStorage.setItem(key, JSON.stringify(state));
                } catch (error) {
                    console.warn(`Error setting localStorage key "${key}":`, error);
                }
            }, [key, state]);

            return [state, setState];
        }

        const Simulator = ({ config }) => {
            // useState を usePersistentState に変更し、タブID(config.id)をキーに含めて独立保存
            const [baseInitialCost, setBaseInitialCost] = usePersistentState(`${config.id}_baseInitialCost`, config.initialCost);
            const [baseRunningCost, setBaseRunningCost] = usePersistentState(`${config.id}_baseRunningCost`, config.runningCost);
            const [inflation, setInflation] = usePersistentState(`${config.id}_inflation`, INFLATION_SCENARIOS[0]);
            
            const [headquarters, setHeadquarters] = usePersistentState(`${config.id}_hqs`, config.hqs);

            const initialCost = useMemo(() => Math.round(baseInitialCost * inflation.rate), [baseInitialCost, inflation]);
            const runningCost = useMemo(() => Math.round(baseRunningCost * inflation.rate), [baseRunningCost, inflation]);

            const [selectedPattern, setSelectedPattern] = usePersistentState(`${config.id}_pattern`, PRESETS[0]);
            const [weightEqual, setWeightEqual] = usePersistentState(`${config.id}_wEqual`, PRESETS[0].equal);
            const [weightPop, setWeightPop] = usePersistentState(`${config.id}_wPop`, PRESETS[0].pop);
            const [weightFinance, setWeightFinance] = usePersistentState(`${config.id}_wFin`, PRESETS[0].finance);
            const [weightError, setWeightError] = useState('');

            useEffect(() => {
                const total = Number(weightEqual) + Number(weightPop) + Number(weightFinance);
                setWeightError(total !== 100 ? `按分ウェイトの合計が100%になりません (現在: ${total}%)` : '');
            }, [weightEqual, weightPop, weightFinance]);

            const activeTotals = useMemo(() => {
                let pop = 0; let finance = 0; let calls = 0;
                headquarters.forEach(hq => {
                    if (hq.isActive) {
                        if (hq.isGroup) {
                            hq.children.forEach(c => {
                                if (c.isActive) { pop += c.pop; finance += c.finance; calls += c.calls; }
                            });
                        } else {
                            pop += hq.pop; finance += hq.finance; calls += hq.calls;
                        }
                    }
                });
                return { pop: pop || 1, finance: finance || 1, calls: calls || 1 };
            }, [headquarters]);

            const calculatedData = useMemo(() => {
                const processedHqs = headquarters.map(hq => {
                    if (!hq.isActive) return { ...hq, activePop: 0, activeFinance: 0, activeCalls: 0, activeChildCount: 0 };
                    if (hq.isGroup && hq.children) {
                        const activeChildren = hq.children.filter(c => c.isActive);
                        return {
                            ...hq,
                            activePop: activeChildren.reduce((s, c) => s + c.pop, 0),
                            activeFinance: activeChildren.reduce((s, c) => s + c.finance, 0),
                            activeCalls: activeChildren.reduce((s, c) => s + c.calls, 0),
                            activeChildCount: activeChildren.length
                        };
                    } else {
                        return { ...hq, activePop: hq.pop, activeFinance: hq.finance, activeCalls: hq.calls, activeChildCount: 0 };
                    }
                });

                const totalActivePop = processedHqs.reduce((s, hq) => s + hq.activePop, 0) || 1; 
                const totalActiveFinance = processedHqs.reduce((s, hq) => s + hq.activeFinance, 0) || 1;
                const totalActiveCalls = processedHqs.reduce((s, hq) => s + hq.activeCalls, 0) || 1;
                const activeHqCount = processedHqs.filter(h => h.isActive).length || 1;

                return processedHqs.map(hq => {
                    if (!hq.isActive) {
                        const empty = { total: 0, ratio: 0 };
                        return { ...hq, initial: empty, running: empty, calculatedChildren: hq.children ? hq.children.map(c => ({...c, initial: empty, running: empty})) : [] };
                    }
                    const costEqual = (initialCost * (weightEqual / 100)) / activeHqCount;
                    const costPop = initialCost * (weightPop / 100) * (hq.activePop / totalActivePop);
                    const costFinance = initialCost * (weightFinance / 100) * (hq.activeFinance / totalActiveFinance);
                    
                    const initialTotal = Math.round(costEqual + costPop + costFinance);
                    const initialRatio = initialCost > 0 ? (initialTotal / initialCost) * 100 : 0;
                    const runningTotal = Math.round(runningCost * (hq.activeCalls / totalActiveCalls));
                    const runningRatio = totalActiveCalls > 0 ? (hq.activeCalls / totalActiveCalls) * 100 : 0; 

                    const parentData = { ...hq, initial: { total: initialTotal, ratio: initialRatio }, running: { total: runningTotal, ratio: runningRatio } };

                    if (hq.isGroup && hq.children) {
                        parentData.calculatedChildren = hq.children.map(child => {
                            if (!child.isActive) return { ...child, initial: { total: 0, ratio: 0 }, running: { total: 0, ratio: 0 } };
                            const c_equal = costEqual / hq.activeChildCount;
                            const c_pop = hq.activePop > 0 ? costPop * (child.pop / hq.activePop) : 0;
                            const c_finance = hq.activeFinance > 0 ? costFinance * (child.finance / hq.activeFinance) : 0;
                            const c_initialTotal = Math.round(c_equal + c_pop + c_finance);
                            const c_initialRatio = initialCost > 0 ? (c_initialTotal / initialCost) * 100 : 0;
                            const c_runningTotal = hq.activeCalls > 0 ? Math.round(runningTotal * (child.calls / hq.activeCalls)) : 0;
                            const c_runningRatio = totalActiveCalls > 0 ? (child.calls / totalActiveCalls) * 100 : 0; 
                            return { ...child, initial: { total: c_initialTotal, ratio: c_initialRatio }, running: { total: c_runningTotal, ratio: c_runningRatio } };
                        });
                    }
                    return parentData;
                });
            }, [initialCost, runningCost, weightEqual, weightPop, weightFinance, headquarters]);

            const formatCurrency = (manYen) => {
                if (manYen === 0) return '0円';
                const oku = Math.floor(manYen / 10000);
                const man = Math.round(manYen % 10000);
                if (oku > 0) return man > 0 ? `${oku.toLocaleString()}億 ${man.toLocaleString()}万円` : `${oku.toLocaleString()}億円`;
                return `${man.toLocaleString()}万円`;
            };

            const handleDataChange = (index, field, value, childIndex = null) => {
                const newData = [...headquarters];
                if (childIndex !== null) newData[index].children[childIndex][field] = Number(value);
                else newData[index][field] = Number(value);
                setHeadquarters(newData);
            };

            const handleToggleActive = (index, childIndex = null) => {
                const newData = [...headquarters];
                if (childIndex !== null) {
                    newData[index].children[childIndex].isActive = !newData[index].children[childIndex].isActive;
                    newData[index].isActive = newData[index].children.some(c => c.isActive);
                } else {
                    const newStatus = !newData[index].isActive;
                    newData[index].isActive = newStatus;
                    if (newData[index].isGroup && newData[index].children) newData[index].children.forEach(c => c.isActive = newStatus);
                }
                setHeadquarters(newData);
            };

            const handlePatternSelect = (e) => {
                const pattern = PRESETS.find(p => p.id === e.target.value);
                setSelectedPattern(pattern);
                if (pattern.id !== 'custom') { setWeightEqual(pattern.equal); setWeightPop(pattern.pop); setWeightFinance(pattern.finance); }

            const handleSliderChange = (setter, value) => {
                setter(value);
                setSelectedPattern(PRESETS.find(p => p.id === 'custom'));
            };

            const activeHqs = calculatedData.filter(hq => hq.isActive);
            const sortedActiveHqs = [...activeHqs].sort((a, b) => b.initial.total - a.initial.total);
            const top1 = sortedActiveHqs.length > 0 ? sortedActiveHqs[0] : null;
            const top2 = sortedActiveHqs.length > 1 ? sortedActiveHqs[1] : null;

            return (

                            <h1 className="text-2xl md:text-3xl font-bold text-gray-800">{config.title}</h1>
                            <p className="text-gray-500 mt-2 text-sm md:text-base print-hide">{config.desc}</p>
                        </div>

                                            <div key={idx} className={`flex flex-col gap-1 transition-opacity ${!data.isActive ? 'opacity-40 grayscale' : ''}`}>
                                                <div className="flex justify-between text-sm">
                                                    <span className={`font-medium flex items-center gap-1 ${!data.isActive ? 'text-gray-400 line-through' : 'text-gray-700'}`}>
                                                        <span className={`w-2 h-2 rounded-full ${data.color}`}></span>
                                                        {data.name}
                                                        {data.isGroup && data.isActive && <span className="text-xs font-normal text-gray-500">({data.activeChildCount}市計)</span>}
                                                        {!data.isActive && <span className="text-xs text-red-500 font-bold ml-1">(離脱)</span>}
                                                    </span>
                                                    <div className="flex gap-4">
                                                        <span className="text-gray-500">{data.isActive ? data.running.ratio.toFixed(1) : '0.0'}%</span>
                                                        <span className={`font-bold ${data.isActive ? 'text-green-700' : 'text-gray-400'}`}>{data.isActive ? formatCurrency(data.running.total) : '0円'}</span>
                                                    </div>
                                                </div>
                                                {data.isActive && (
                                                    <div className="w-full bg-gray-100 rounded-full h-1.5"><div className={`${data.color} h-1.5 rounded-full opacity-80`} style={{ width: `${data.running.ratio}%` }}></div></div>
                                                )}
                                                {data.isGroup && data.isActive && (
                                                    <div className="mt-1.5 mb-2 pl-4 border-l-2 border-gray-200 space-y-1.5">
                                                        {data.calculatedChildren.map((child, cIdx) => (
                                                            <div key={`run-child-${cIdx}`} className={`flex justify-between text-xs ${!child.isActive ? 'text-gray-400 line-through' : 'text-gray-500'}`}>
                                                                <span>└ {child.name} { !child.isActive && <span className="text-red-400 text-[10px]">(離脱)</span> }</span>
                                                                <div className="flex gap-3"><span>{child.isActive ? child.running.ratio.toFixed(1) : '0.0'}%</span><span>{child.isActive ? formatCurrency(child.running.total) : '0円'}</span></div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                    <div className="mt-5 pt-3 border-t flex justify-between font-bold text-sm text-gray-800 sticky bottom-0 bg-white">
                                        <span>全体合計</span><span className="text-green-800">{formatCurrency(runningCost)} / 年</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const ComprehensiveSimulator = () => {
            const [subTab, setSubTab] = usePersistentState('comp_subTab', 'step1');

            // Format Helpers
            const formatOku = amount => {
                if (isNaN(amount) || !isFinite(amount)) return '0.00 億円';
                return (amount / 100000000).toFixed(2) + ' 億円';
            };
            const formatOkuSigned = amount => {
                if (isNaN(amount) || !isFinite(amount)) return `±0 億円`;
                const val = (Math.abs(amount) / 100000000).toFixed(2);
                if (amount > 0) return <span className="text-emerald-500 font-bold">+{val} 億円</span>;
                if (amount < 0) return <span className="text-red-400 font-bold">-{val} 億円</span>;
                return `±0 億円`;
            };

            // ---- STEP 1 State (オートセーブ化) ----
            const [s1Method, setS1Method] = usePersistentState('comp_s1Method', 'weighted');
            const [s1Gross, setS1Gross] = usePersistentState('comp_s1Gross', 2645165600);
            const [s1ExOA, setS1ExOA] = usePersistentState('comp_s1ExOA', 0);
            const [s1ExRadio, setS1ExRadio] = usePersistentState('comp_s1ExRadio', 0);
            const [s1ExOther, setS1ExOther] = usePersistentState('comp_s1ExOther', 0);
            const [s1Maint, setS1Maint] = usePersistentState('comp_s1Maint', 397939102);
            const [s1Op, setS1Op] = usePersistentState('comp_s1Op', 151649630);
            const [s1Mid, setS1Mid] = usePersistentState('comp_s1Mid', 601382100);
            const [s1Hqs, setS1Hqs] = usePersistentState('comp_s1Hqs', [
                { id: 'h1_0', name: '岡崎市', ratio: 85, isBase: true },
                { id: 'h1_1', name: '幸田町', ratio: 15, isBase: false }
            ]);
            const [s1Yrs, setS1Yrs] = usePersistentState('comp_s1Yrs', 10);
            const [s1R1, setS1R1] = usePersistentState('comp_s1R1', 1.0);
            const [s1R2, setS1R2] = usePersistentState('comp_s1R2', 2.0);
            const [s1R3, setS1R3] = usePersistentState('comp_s1R3', 3.0);
            
            const s1ChartRef = useRef(null);
            const chartInstance1 = useRef(null);

            // ---- STEP 2 State (オートセーブ化) ----
            const [s2GInit, setS2GInit] = usePersistentState('comp_s2GInit', 5000000000);
            const [s2GMaint, setS2GMaint] = usePersistentState('comp_s2GMaint', 2500000000);
            const [s2GMid, setS2GMid] = usePersistentState('comp_s2GMid', 1200000000);
            const [s2GBldg, setS2GBldg] = usePersistentState('comp_s2GBldg', 1000000000);
            const [s2GFacil, setS2GFacil] = usePersistentState('comp_s2GFacil', 300000000);
            const [s2UseBonds, setS2UseBonds] = usePersistentState('comp_s2UseBonds', false);
            const [s2BondRatio, setS2BondRatio] = usePersistentState('comp_s2BondRatio', 100);
            const [s2TaxRatio, setS2TaxRatio] = usePersistentState('comp_s2TaxRatio', 50);
            const [s2Shift, setS2Shift] = usePersistentState('comp_s2Shift', 3);
            const [s2StaffPer, setS2StaffPer] = usePersistentState('comp_s2StaffPer', 15);
            const [s2DayStaff, setS2DayStaff] = usePersistentState('comp_s2DayStaff', 6);
            const [s2UnitCost, setS2UnitCost] = usePersistentState('comp_s2UnitCost', 8000000);
            const [s2Alloc, setS2Alloc] = usePersistentState('comp_s2Alloc', 'pop');
            const [s2MixPop, setS2MixPop] = usePersistentState('comp_s2MixPop', 50);
            const [s2Hqs, setS2Hqs] = usePersistentState('comp_s2Hqs', [
                { id: 'okazaki', name: '岡崎市', pop: 383000, finance: 58000, currentStaff: 24, singleInit: 3500000000, singleMaint: 1549000000, singleMid: 601000000, oaCost: 0, radioCost: 0, otherCost: 0, color: '#3b82f6', manualRatio: 0 },
                { id: 'toyota', name: '豊田市', pop: 416000, finance: 62000, currentStaff: 25, singleInit: 3600000000, singleMaint: 1600000000, singleMid: 700000000, oaCost: 0, radioCost: 0, otherCost: 0, color: '#ef4444', manualRatio: 0 },
                { id: 'nishio', name: '西尾市', pop: 169000, finance: 31000, currentStaff: 12, singleInit: 1800000000, singleMaint: 800000000, singleMid: 300000000, oaCost: 0, radioCost: 0, otherCost: 0, color: '#f59e0b', manualRatio: 0 },
                { id: 'kota', name: '幸田町', pop: 42000,  finance: 7500,  currentStaff: 5,  singleInit: 800000000, singleMaint: 400000000, singleMid: 150000000, oaCost: 0, radioCost: 0, otherCost: 0, color: '#10b981', manualRatio: 0 },
                { id: 'kinuura', name: '衣浦東部', pop: 540000, finance: 95000, currentStaff: 30, singleInit: 4000000000, singleMaint: 1800000000, singleMid: 800000000, oaCost: 0, radioCost: 0, otherCost: 0, color: '#8b5cf6', manualRatio: 0 }
            ]);

            const s2LccChartRef = useRef(null);
            const s2ImpactChartRef = useRef(null);
            const chartInstance2Lcc = useRef(null);
            const chartInstance2Impact = useRef(null);

            // ---- STEP 1 Calculations ----
            const step1Calc = useMemo(() => {
                const netInit = s1Gross - (s1ExOA + s1ExRadio + s1ExOther);
                const opEx = (s1Maint * 2) + s1Op + s1Mid;
                const curLCC = netInit + opEx;
                
                let totalRatio = s1Hqs.reduce((s, h) => s + h.ratio, 0) || 1;
                const baseHq = s1Hqs.find(h => h.isBase) || s1Hqs[0] || { ratio: 0, name: '全体' };
                const basePct = baseHq.ratio / totalRatio;

                const r1 = s1R1/100, r2 = s1R2/100, r3 = s1R3/100, yrs = s1Yrs;
                let fCap1, fCap2, fCap3, fLcc1, fLcc2, fLcc3;

                if (s1Method === 'compound') {
                    fCap1 = netInit*Math.pow(1+r1,yrs); fCap2 = netInit*Math.pow(1+r2,yrs); fCap3 = netInit*Math.pow(1+r3,yrs);
                    fLcc1 = curLCC*Math.pow(1+r1,yrs);  fLcc2 = curLCC*Math.pow(1+r2,yrs);  fLcc3 = curLCC*Math.pow(1+r3,yrs);
                } else if(s1Method === 'weighted') {
                    const f1 = 0.35*Math.pow(1.01,yrs) + 0.45*Math.pow(1.02,yrs) + 0.2*Math.pow(1.015,yrs);
                    const f2 = 0.35*Math.pow(1.015,yrs)+ 0.45*Math.pow(1.032,yrs)+ 0.2*Math.pow(1.028,yrs);
                    const f3 = 0.35*Math.pow(1.025,yrs)+ 0.45*Math.pow(1.045,yrs)+ 0.2*Math.pow(1.038,yrs);
                    fCap1 = netInit*f1; fCap2 = netInit*f2; fCap3 = netInit*f3;
                    fLcc1 = curLCC*f1;  fLcc2 = curLCC*f2;  fLcc3 = curLCC*f3;
                } else {
                    const f1 = Math.pow(1.015,Math.min(5,yrs))*Math.pow(1.008,Math.max(0,yrs-5));
                    const f2 = Math.pow(1.030,Math.min(5,yrs))*Math.pow(1.015,Math.max(0,yrs-5));
                    const f3 = Math.pow(1.045,Math.min(5,yrs))*Math.pow(1.020,Math.max(0,yrs-5));
                    fCap1 = netInit*f1; fCap2 = netInit*f2; fCap3 = netInit*f3;
                    fLcc1 = curLCC*f1;  fLcc2 = curLCC*f2;  fLcc3 = curLCC*f3;
                }

                const scenarios = [
                    {n: s1Method==='compound'?'シナリオ1 (マイルド)':s1Method==='weighted'?'保守的推計':'早期収束型', c: fCap1, l: fLcc1, col:'text-emerald-700'},
                    {n: s1Method==='compound'?'シナリオ2 (標準)':s1Method==='weighted'?'加重平均推計':'2段階標準型', c: fCap2, l: fLcc2, col:'text-blue-700 font-bold'},
                    {n: s1Method==='compound'?'シナリオ3 (高騰警戒)':s1Method==='weighted'?'IT高騰推計':'長期化型', c: fCap3, l: fLcc3, col:'text-amber-700'}
                ];

                const labels = Array.from({length: yrs+1}, (_,i)=>`${i}年後`);
                const cr1 = curLCC > 0 ? Math.pow(fLcc1/curLCC, 1/yrs)-1 : 0;
                const cr2 = curLCC > 0 ? Math.pow(fLcc2/curLCC, 1/yrs)-1 : 0;
                const cr3 = curLCC > 0 ? Math.pow(fLcc3/curLCC, 1/yrs)-1 : 0;
                const d1 = labels.map((_,i)=> (curLCC*Math.pow(1+cr1,i))/100000000);
                const d2 = labels.map((_,i)=> (curLCC*Math.pow(1+cr2,i))/100000000);
                const d3 = labels.map((_,i)=> (curLCC*Math.pow(1+cr3,i))/100000000);

                return { netInit, opEx, curLCC, totalRatio, baseHq, basePct, fLcc2, scenarios, labels, d1, d2, d3, fCap2 };
            }, [s1Method, s1Gross, s1ExOA, s1ExRadio, s1ExOther, s1Maint, s1Op, s1Mid, s1Hqs, s1Yrs, s1R1, s1R2, s1R3]);

            useEffect(() => {
                if (subTab === 'step1' && s1ChartRef.current && window.Chart) {
                    if (chartInstance1.current) chartInstance1.current.destroy();
                    chartInstance1.current = new Chart(s1ChartRef.current, {
                        type: 'line',
                        data: {
                            labels: step1Calc.labels,
                            datasets: [
                                {label: step1Calc.scenarios[0].n, data: step1Calc.d1, borderColor:'#10b981', backgroundColor:'#10b98120', tension:0.3},
                                {label: step1Calc.scenarios[1].n, data: step1Calc.d2, borderColor:'#2563eb', backgroundColor:'#2563eb20', borderWidth:3, tension:0.3},
                                {label: step1Calc.scenarios[2].n, data: step1Calc.d3, borderColor:'#f59e0b', backgroundColor:'#f59e0b20', tension:0.3}
                            ]
                        },
                        options: { responsive:true, maintainAspectRatio:false, plugins:{ legend:{position:'bottom'} } }
                    });
                }
            }, [step1Calc, subTab]);

            // ---- STEP 2 Calculations ----
            const step2Calc = useMemo(() => {
                const grossGlobalLCC = s2GInit + s2GMaint + s2GMid + s2GBldg + s2GFacil;
                const bondTarget = s2GInit + s2GBldg;
                const bondSubsidy = bondTarget * (s2BondRatio/100) * (s2TaxRatio/100);
                const effectiveLCC = s2UseBonds ? grossGlobalLCC - bondSubsidy : grossGlobalLCC;
                
                const totStaff = (s2Shift * s2StaffPer) + s2DayStaff;
                let tPop = 0, tFin = 0, tCurStaff = 0, sumSLcc = 0, sumSysSav = 0, sumStfSav = 0, sumTot = 0;
                
                const cLbl=[], cCol=[], cSLcc=[], cWLcc=[], cTot=[];

                const results = s2Hqs.map(h => {
                    tPop += h.pop; tFin += h.finance; tCurStaff += h.currentStaff;
                    const grossS = h.singleInit + h.singleMaint + h.singleMid;
                    const exS = h.oaCost + h.radioCost + h.otherCost;
                    const sLcc = grossS - exS;
                    return { ...h, sLcc };
                }).map(h => {
                    const rPop = tPop>0 ? h.pop/tPop : 0; 
                    const rFin = tFin>0 ? h.finance/tFin : 0;
                    let ratio = 0;
                    if(s2Alloc === 'pop') ratio = rPop;
                    else if(s2Alloc === 'fin') ratio = rFin;
                    else if(s2Alloc === 'mix') ratio = rPop*(s2MixPop/100) + rFin*((100-s2MixPop)/100);
                    else ratio = h.manualRatio / 100;

                    const wLcc = effectiveLCC * ratio;
                    const fStf = totStaff * ratio;
                    const sysSav = h.sLcc - wLcc;
                    const stfSav = (h.currentStaff - fStf) * s2UnitCost * 10;
                    const totImp = sysSav + stfSav;

                    sumSLcc+=h.sLcc; sumSysSav+=sysSav; sumStfSav+=stfSav; sumTot+=totImp;
                    cLbl.push(h.name); cCol.push(h.color); cSLcc.push((h.sLcc/100000000).toFixed(1)); cWLcc.push((wLcc/100000000).toFixed(1)); cTot.push((totImp/100000000).toFixed(1));

                    return { ...h, ratio, wLcc, fStf, sysSav, stfSav, totImp };
                });

                return { 
                    grossGlobalLCC, bondTarget, bondSubsidy, effectiveLCC, totStaff, 
                    tPop, tFin, tCurStaff, sumSLcc, sumSysSav, sumStfSav, sumTot, results, 
                    cLbl, cCol, cSLcc, cWLcc, cTot 
                };
            }, [s2GInit, s2GMaint, s2GMid, s2GBldg, s2GFacil, s2UseBonds, s2BondRatio, s2TaxRatio, s2Shift, s2StaffPer, s2DayStaff, s2UnitCost, s2Alloc, s2MixPop, s2Hqs]);

            useEffect(() => {
                if (subTab === 'step2' && s2LccChartRef.current && s2ImpactChartRef.current && window.Chart) {
                    if (chartInstance2Lcc.current) chartInstance2Lcc.current.destroy();
                    chartInstance2Lcc.current = new Chart(s2LccChartRef.current, {
                        type:'bar', 
                        data: { labels:step2Calc.cLbl, datasets:[ {label:'単独LCC', data:step2Calc.cSLcc, backgroundColor:'#94a3b8'}, {label:'広域負担額', data:step2Calc.cWLcc, backgroundColor:'#22d3ee'} ]}, 
                        options: {responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'top'}}}
                    });
                    
                    if (chartInstance2Impact.current) chartInstance2Impact.current.destroy();
                    chartInstance2Impact.current = new Chart(s2ImpactChartRef.current, {
                        type:'bar', 
                        data: { labels:step2Calc.cLbl, datasets:[ {label:'総合効果', data:step2Calc.cTot, backgroundColor:step2Calc.cCol} ]}, 
                        options: {responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}}
                    });
                }
            }, [step2Calc, subTab]);

            return (
                <div className="bg-slate-100 text-slate-800 min-h-screen p-4 md:p-6 font-sans">
                    <div className="max-w-[1600px] mx-auto">
                        <header className="mb-6 flex flex-col items-center">
                            <h1 className="text-2xl md:text-3xl font-bold text-slate-900 mb-4 print-hide">総合財政シミュレーター (外部統合ツール)</h1>
                            <div className="inline-flex bg-slate-200 p-1 rounded-xl gap-1 shadow-inner print-hide">
                                <button onClick={() => setSubTab('step1')} className={`px-6 py-2.5 rounded-lg font-bold text-sm transition-all w-64 ${subTab==='step1' ? 'bg-blue-600 text-white shadow-sm' : 'bg-transparent text-slate-600 hover:bg-white hover:shadow-sm'}`}>STEP1: 10年後 単独更新・将来予測</button>
                                <button onClick={() => setSubTab('step2')} className={`px-6 py-2.5 rounded-lg font-bold text-sm transition-all w-64 ${subTab==='step2' ? 'bg-blue-600 text-white shadow-sm' : 'bg-transparent text-slate-600 hover:bg-white hover:shadow-sm'}`}>STEP2: 西三河広域化 総合財政効果</button>
                            </div>
                        </header>

                        {/* STEP 1 */}
                        {subTab === 'step1' && (
                            <div className="grid grid-cols-1 xl:grid-cols-12 gap-6">
                                <div className="xl:col-span-4 bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-5">
                                    <h2 className="text-lg font-bold text-slate-900 border-b border-slate-100 pb-3 flex items-center gap-2">
                                        <svg className="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
                                        試算パラメーター
                                    </h2>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">試算手法の選択</label>
                                        <select value={s1Method} onChange={e=>setS1Method(e.target.value)} className="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg text-xs font-semibold focus:ring-2 focus:ring-blue-500 outline-none">
                                            <option value="compound">【手法1】一律複利モデル（全体年率）</option>
                                            <option value="weighted">【手法2】費目別（加重平均）モデル ※推奨</option>
                                            <option value="staged">【手法3】段階的（前半高・後半安定）モデル</option>
                                        </select>
                                        <div className="mt-2 text-[10.5px] sm:text-xs text-slate-700 bg-blue-50 p-3 rounded-lg border border-blue-100 leading-relaxed shadow-inner">
                                            {s1Method === 'compound' && <><span className="font-bold text-slate-800 border-b border-slate-300 pb-0.5 mb-1.5 block">【手法1】一律複利モデル</span>全体のコストに対して一律のインフレ率を適用するシンプルなモデル。<br/><span className="text-emerald-700 font-bold">●シナリオ1(マイルド):</span> 緩やかな進行<br/><span className="text-blue-700 font-bold">●シナリオ2(標準):</span> 安定したインフレ目標<br/><span className="text-amber-700 font-bold">●シナリオ3(高騰警戒):</span> 物価高・円安トレンドの継続</>}
                                            {s1Method === 'weighted' && <><span className="font-bold text-slate-800 border-b border-slate-300 pb-0.5 mb-1.5 block">【手法2】費目別（加重平均）モデル ※推奨</span>ハード/ソフト/維持管理で異なる物価上昇率を加重平均した実態に近いモデル。<br/><span className="text-emerald-700 font-bold">●保守的推計:</span> 小幅な上昇<br/><span className="text-blue-700 font-bold">●加重平均推計(標準):</span> 近年の上昇トレンドを反映<br/><span className="text-amber-700 font-bold">●IT高騰推計:</span> 大幅なコスト増前提</>}
                                            {s1Method === 'staged' && <><span className="font-bold text-slate-800 border-b border-slate-300 pb-0.5 mb-1.5 block">【手法3】段階的（前半高・後半安定）モデル</span>導入からの年数で異なる物価上昇率を設定。<br/><span className="text-emerald-700 font-bold">●早期収束型:</span> 直近5年のみインフレ<br/><span className="text-blue-700 font-bold">●2段階標準型(標準):</span> 前半高・後半緩やか<br/><span className="text-amber-700 font-bold">●長期化型:</span> 高インフレ状態が長期継続</>}
                                        </div>
                                    </div>

                                    <div className="p-3 bg-slate-50 rounded-xl border border-slate-200 space-y-3">
                                        <div><span className="font-bold text-slate-800 text-xs block mb-1">① 現在の確定初期整備費・見積総額 (円)</span><input type="number" value={s1Gross} onChange={e=>setS1Gross(Number(e.target.value))} className="w-full p-2 bg-white border border-slate-300 rounded font-mono text-sm" /></div>
                                        <div className="border-t border-slate-200 pt-2"><span className="font-bold text-slate-800 text-xs block mb-1">② 最初に除外(控除)する項目 (円)</span>
                                            <div className="grid grid-cols-3 gap-2">
                                                <div><label className="block text-[10px] text-slate-600">消防OA</label><input type="number" value={s1ExOA} onChange={e=>setS1ExOA(Number(e.target.value))} className="w-full p-1.5 bg-white border border-slate-300 rounded font-mono text-xs text-right" /></div>
                                                <div><label className="block text-[10px] text-slate-600">消防無線</label><input type="number" value={s1ExRadio} onChange={e=>setS1ExRadio(Number(e.target.value))} className="w-full p-1.5 bg-white border border-slate-300 rounded font-mono text-xs text-right" /></div>
                                                <div><label className="block text-[10px] text-slate-600">単独装備等</label><input type="number" value={s1ExOther} onChange={e=>setS1ExOther(Number(e.target.value))} className="w-full p-1.5 bg-white border border-slate-300 rounded font-mono text-xs text-right" /></div>
                                            </div>
                                        </div>
                                        <div className="bg-blue-100 p-2 rounded flex justify-between items-center"><span className="text-xs font-bold text-blue-800">③ 純粋な初期整備費 (①-②)</span><span className="font-mono text-sm font-bold text-blue-900">{step1Calc.netInit.toLocaleString()} 円</span></div>

                                                            <td className="p-1 bg-slate-50/50"><input type="number" value={h.radioCost} onChange={e=>{const n=[...s2Hqs]; n[i].radioCost=Number(e.target.value); setS2Hqs(n);}} className="w-full min-w-[70px] p-1 border rounded text-right font-mono text-xs" /></td>
                                                            <td className="p-1 bg-slate-50/50 border-r"><input type="number" value={h.otherCost} onChange={e=>{const n=[...s2Hqs]; n[i].otherCost=Number(e.target.value); setS2Hqs(n);}} className="w-full min-w-[70px] p-1 border rounded text-right font-mono text-xs" /></td>
                                                            <td className="p-1 text-right bg-red-50 text-red-900 font-bold">{formatOku(h.sLcc)}</td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>

                                    <div className="bg-slate-900 p-4 rounded-xl shadow-sm border border-slate-800 text-white">
                                        <h2 className="text-sm font-bold text-slate-100 border-l-4 border-emerald-500 pl-2 mb-3">10年間の総合財政効果試算（システム負担 ＋ 人件費削減）</h2>
                                        <div className="overflow-x-auto custom-scrollbar pb-2">
                                            <table className="w-full text-left border-collapse text-xs min-w-[900px]">
                                                <thead>
                                                    <tr className="bg-slate-800 text-slate-300 border-b border-slate-700">
                                                        <th className="p-2 font-semibold">消防本部名</th>
                                                        <th className="p-2 font-semibold text-right text-slate-400">【控除後】単独10年LCC</th>
                                                        <th className="p-2 font-semibold text-right text-slate-400">人員推移 (人)</th>
                                                        <th className="p-2 font-semibold text-right text-cyan-300 border-l border-slate-700">
                                                            ① 広域LCC負担額<br/>{s2UseBonds && <span className="text-[9px] text-emerald-200 font-normal">(交付税控除後)</span>}
                                                        </th>
                                                        <th className="p-2 font-semibold text-right text-emerald-400 border-l border-slate-700">② LCC 削減額<br/>(単独 - ①)</th>
                                                        <th className="p-2 font-semibold text-right text-blue-400 border-l border-slate-700">③ 10年間 人件費削減<br/>(削減人数×単価×10年)</th>
                                                        <th className="p-2 font-semibold text-right text-amber-400 bg-slate-800 border-l border-slate-600">【10年間】総合効果<br/>(② + ③)</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-700 font-mono">
                                                    {step2Calc.results.map((h, i) => (
                                                        <tr key={`res_${i}`} className="hover:bg-slate-800">
                                                            <td className="p-2 font-semibold text-white flex items-center gap-1"><div className="w-3 h-3 rounded-full" style={{background:h.color}}></div>{h.name}</td>
                                                            <td className="p-2 text-right text-slate-300">{formatOku(h.sLcc)}</td>
                                                            <td className="p-2 text-right text-slate-300">{h.currentStaff} → {h.fStf.toFixed(1)}</td>
                                                            <td className="p-2 text-right text-cyan-300 font-bold border-l border-slate-700">{formatOku(h.wLcc)}</td>
                                                            <td className="p-2 text-right border-l border-slate-700">{formatOkuSigned(h.sysSav)}</td>
                                                            <td className="p-2 text-right border-l border-slate-700">{formatOkuSigned(h.stfSav)}</td>
                                                            <td className="p-2 text-right text-base bg-slate-900 border-l border-slate-600">{formatOkuSigned(h.totImp)}</td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                                <tfoot className="border-t-2 border-slate-600 bg-slate-800">
                                                    <tr>
                                                        <td className="p-2 font-bold text-white text-right">広域化 全体合計</td>
                                                        <td className="p-2 text-right text-slate-300 font-bold">{formatOku(step2Calc.sumSLcc)}</td>
                                                        <td className="p-2 text-right text-slate-300 font-bold">{step2Calc.tCurStaff} → {step2Calc.totStaff.toFixed(1)}</td>
                                                        <td className="p-2 text-right text-cyan-300 font-bold border-l border-slate-700">{formatOku(step2Calc.effectiveLCC)}</td>
                                                        <td className="p-2 text-right border-l border-slate-700">{formatOkuSigned(step2Calc.sumSysSav)}</td>
                                                        <td className="p-2 text-right border-l border-slate-700">{formatOkuSigned(step2Calc.sumStfSav)}</td>
                                                        <td className="p-2 text-right text-lg text-amber-400 bg-slate-900 font-bold border-l border-slate-600">{formatOkuSigned(step2Calc.sumTot)}</td>
                                                    </tr>
                                                </tfoot>
                                            </table>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                                            <h3 className="text-xs font-bold text-slate-700 mb-2 text-center">10年LCC比較（単独更新 vs 広域化負担）</h3>
                                            <div className="h-56 relative"><canvas ref={s2LccChartRef}></canvas></div>
                                        </div>
                                        <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                                            <h3 className="text-xs font-bold text-slate-700 mb-2 text-center">10年間の総合財政効果（LCC削減＋人件費削減）</h3>
                                            <div className="h-56 relative"><canvas ref={s2ImpactChartRef}></canvas></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // =========================================================================
        // メインアプリケーション (タブ切り替え管理)
        // =========================================================================
        const App = () => {
            const tabs = [
                { 
                    id: 'nishimikawa', label: '西三河地区', 
                    data: { id: 'nishimikawa', title: '西三河地区 消防指令センター 按分シミュレーター', desc: '共通経費を入力し、各本部の負担割合を試算します。', hqs: NISHI_MIKAWA_HQS, initialCost: 300000, runningCost: 20000, label: '西三河' } 
                },
                { 
                    id: 'allmikawa', label: 'オール三河', 
                    data: { id: 'allmikawa', title: 'オール三河 消防指令センター 按分シミュレーター', desc: '西三河・東三河の全域を対象に負担割合を試算します。', hqs: ALL_MIKAWA_HQS, initialCost: 450000, runningCost: 30000, label: 'オール三河' } 
                },
                { 
                    id: 'aichi', label: '愛知県全域', 
                    data: { id: 'aichi', title: '愛知県全域 消防指令センター 按分シミュレーター', desc: '愛知県全域の消防本部を対象に、共通経費負担を試算します。', hqs: AICHI_HQS, initialCost: 1000000, runningCost: 100000, label: '愛知県域' } 
                },
                {
                    id: 'comprehensive', label: '総合財政シミュレーター (外部統合)', isComprehensive: true
                }
            ];
            
            const [activeTabId, setActiveTabId] = usePersistentState('app_activeTab', tabs[0].id);

            const handleResetAll = () => {
                if (window.confirm('入力したすべての数値や設定を初期状態にリセットしますか？\n（この操作は取り消せません）')) {
                    window.localStorage.clear();
                    window.location.reload();
                }
            };

            return (
                <div className="min-h-screen pb-10">
                    <div className="bg-white border-b border-gray-200 sticky top-0 z-50 print-hide shadow-sm mb-6">
                        <div className="max-w-[95rem] mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center">
                            <nav className="-mb-px flex space-x-8 overflow-x-auto custom-scrollbar" aria-label="Tabs">
                                {tabs.map(tab => (
                                    <button
                                        key={tab.id}
                                        onClick={() => setActiveTabId(tab.id)}
                                        className={`whitespace-nowrap py-4 px-1 border-b-2 font-bold text-sm transition-colors ${
                                            activeTabId === tab.id
                                                ? 'border-blue-600 text-blue-600'
                                                : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'
                                        }`}
                                    >
                                        {tab.label}
                                    </button>
                                ))}
                            </nav>
                            <button onClick={handleResetAll} className="flex items-center gap-1.5 text-xs font-bold text-red-500 hover:text-red-700 hover:bg-red-50 px-3 py-1.5 rounded transition-colors whitespace-nowrap">
                                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                                全ての設定を初期化
                            </button>
                        </div>
                    </div>
                    
                    {tabs.map(tab => (
                        <div key={tab.id} className={activeTabId === tab.id ? 'block' : 'hidden'}>
                            {tab.isComprehensive ? <ComprehensiveSimulator /> : <Simulator config={tab.data} />}
                        </div>
                    ))}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
